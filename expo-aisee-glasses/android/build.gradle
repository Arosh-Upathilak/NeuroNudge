plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'com.aisee.glasses'
version = '0.1.0'

android {
  namespace "com.aisee.glasses"
  defaultConfig {
    versionCode 1
    versionName "0.1.0"
  }
  lintOptions {
    abortOnError false
  }
}

repositories {
  flatDir {
    dirs 'libs-repo'
  }
}

dependencies {
    api("com.realsil.sdk:rtk-core-ktx:1.7.83@jar")
    api("com.realsil.sdk:rtk-audioconnect-common:1.15.28@aar")
    api("com.realsil.sdk:rtk-audioconnect-core:1.9.10@jar")
    api("com.realsil.sdk:rtk-dfu:3.14.36@jar")
    api("com.realsil.sdk:rtk-support:1.7.94@aar")
    api("com.realsil.sdk:rtk-support-debugger:1.2.41@aar")
    api("com.realsil.sdk:rtk-androidx-core:1.0.26@jar")
    api("com.realsil.sdk:rtk-audioconnect-smartwear:1.8.41@aar")
    api("com.google.code.gson:gson:2.11.0")
    implementation("androidx.core:core-ktx:1.13.1")
    implementation("androidx.preference:preference-ktx:1.2.1")
    implementation("org.jetbrains.kotlinx:kotlinx-coroutines-android:1.8.1")
}
